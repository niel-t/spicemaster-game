<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Van bench</title>
<style>html,body{margin:0;height:100%;background:#1b1820;color:#eee;font:14px system-ui;overflow:hidden}#ui{position:fixed;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}button{background:#333;color:#eee;border:1px solid #555;padding:6px 10px;border-radius:4px;cursor:pointer}</style>
</head><body><div id="ui"></div><canvas id="c"></canvas>
<script type="module">
// The Oofmobiel and Shooki's Kangoo side by side under a game-like sky.
// ?van=oof|kangoo|both ?liv=zn|eddys ?view=left|right|front|rear|top|three|threeR ?spin=1
import * as THREE from '../vendor/three.module.min.js';
import { makeOofmobiel, makeKangoo, setLivery } from '../js/vehicles.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4cc);
{ // a daylight sky with a bright sun and darker street below, like the hub's
  const t = canvasTex(512, 256, (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#7fa6d8'); g.addColorStop(0.48, '#e4ecf4'); g.addColorStop(0.52, '#6a6460'); g.addColorStop(1, '#2a2622'); x.fillStyle = g; x.fillRect(0, 0, w, h); x.fillStyle = '#fffbe8'; x.beginPath(); x.arc(150, 50, 14, 0, 7); x.fill(); x.fillStyle = '#4a4440'; for (let i = 0; i < 14; i++) x.fillRect(i * 38, h * 0.38 - (i * 37 % 23), 30, h * 0.12 + (i * 37 % 23)); });
  t.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(t).texture; scene.environmentIntensity = 0.8;
}
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x4a3a2a, 0.9));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6); sun.position.set(6, 10, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x5a5856, roughness: 0.92 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const which = q.get('van') || 'both', liv = q.get('liv') || 'zn';
const vans = [];
if (which !== 'kangoo') { const v = makeOofmobiel(THREE, canvasTex); setLivery(v, liv, canvasTex); v.rotation.y = Math.PI / 2; v.position.z = which === 'both' ? -1.6 : 0; scene.add(v); vans.push(v); } // nose +x like the hub
if (which !== 'oof') { const k = makeKangoo(THREE, canvasTex, { plate: 'SH-00-KI', livery: 'shooki' }); k.position.z = which === 'both' ? 1.6 : 0; scene.add(k); vans.push(k); }
const ortho = q.get('ortho') === '1';
const camera = ortho ? new THREE.OrthographicCamera(-4, 4, 3, -3, 0.1, 100) : new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 200);
if (ortho) { const a = innerWidth / innerHeight, s = +(q.get('s') || 3.2); Object.assign(camera, { left: -s * a, right: s * a, top: s, bottom: -s }); camera.updateProjectionMatrix(); }
const D = which === 'both' ? 15 : 11, views = { left: [0, 1.1, D], right: [0, 1.1, -D], front: [D, 1.3, 0], rear: [-D, 1.3, 0], top: [0.01, D * 1.4, 0], three: [D * 0.7, D * 0.35, D * 0.75], threeR: [-D * 0.7, D * 0.35, -D * 0.75], low: [D * 0.55, 0.6, D * 0.55] };
let view = q.get('view') || 'three';
function setView(v) { view = v; camera.position.set(...views[v]); camera.lookAt(0, v === 'top' ? 0 : 0.9, 0); }
setView(view);
const ui = document.getElementById('ui'); if (q.get('ui') === '0') ui.style.display = 'none';
for (const v of Object.keys(views)) { const b = document.createElement('button'); b.textContent = v; b.onclick = () => setView(v); ui.appendChild(b); }
for (const l of ['zn', 'eddys']) { const b = document.createElement('button'); b.textContent = l; b.onclick = () => vans.forEach((g) => setLivery(g, l, canvasTex)); ui.appendChild(b); }
let t = 0;
renderer.setAnimationLoop(() => { if (q.get('spin')) { t += 0.005; camera.position.set(Math.cos(t) * D, 3, Math.sin(t) * D); camera.lookAt(0, 0.9, 0); } renderer.render(scene, camera); });
window.ready = true;
</script></body></html>
