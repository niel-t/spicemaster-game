<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boat bench</title>
<style>html,body{margin:0;height:100%;background:#1b1820;color:#eee;font:14px system-ui;overflow:hidden}#ui{position:fixed;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}button{background:#333;color:#eee;border:1px solid #555;padding:6px 10px;border-radius:4px;cursor:pointer}</style>
</head><body><div id="ui"></div><canvas id="c"></canvas>
<script type="module">
// The canal boats from js/boats.js on a strip of canal water. ?boat=all|sloep|tour|ark|barge|cruiser|speed ?view=three|side|top|bow ?go=1 (under way)
import * as THREE from '../vendor/three.module.min.js';
import { makeSloep, makeTourBoat, makeArk, makeBarge, makeCruiser, rockBoat } from '../js/boats.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9bccc);
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x4a3a2a, 1.0));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.4); sun.position.set(8, 14, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); scene.add(sun);
const water = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshPhongMaterial({ color: 0x2e5a5c, shininess: 80, specular: 0x88aaaa })); water.rotation.x = -Math.PI / 2; water.receiveShadow = true; scene.add(water);
const quay = new THREE.Mesh(new THREE.BoxGeometry(80, 1.2, 4), new THREE.MeshLambertMaterial({ color: 0x9a7a6a })); quay.position.set(0, 0.1, -12); scene.add(quay);
const sign = new THREE.MeshLambertMaterial({ color: 0xffd36b });
const make = { sloep: () => makeSloep({ moving: true }), tour: () => makeTourBoat({ sign }), ark: () => makeArk({ roof: 'flat', wall: 0xd9a441 }), arkp: () => makeArk({ roof: 'pitch', wall: 0x8a3a24 }), barge: () => makeBarge(), cruiser: () => makeCruiser({ moving: true }), speed: () => makeCruiser({ speed: true, moving: true }), cargo: () => makeSloep({ cargo: 4, hull: 0xb5442a, L: 4.4, B: 1.6 }) };
const which = q.get('boat') || 'all', boats = [];
const list = which === 'all' ? ['tour', 'sloep', 'ark', 'barge', 'cruiser', 'speed'] : which.split(',');
list.forEach((k, i) => { const b = make[k](); const n = list.length; b.position.set(which === 'all' ? (i % 2) * 15 - 7 : 0, 0, which === 'all' ? Math.floor(i / 2) * 5 - 5 : (i - (n - 1) / 2) * 5); scene.add(b); boats.push(b); });
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 300);
const D = which === 'all' ? 34 : 15, views = { three: [D * 0.7, D * 0.45, D * 0.75], side: [0, 1.6, D], top: [0.01, D * 1.3, 0.01], bow: [D * 0.8, 2.2, D * 0.25], stern: [-D * 0.75, 3, D * 0.4], low: [D * 0.5, 0.8, D * 0.6] };
function setView(v) { camera.position.set(...views[v]); camera.lookAt(0, 0.6, 0); }
setView(q.get('view') || 'three');
const ui = document.getElementById('ui'); if (q.get('ui') === '0') ui.style.display = 'none';
for (const v of Object.keys(views)) { const b = document.createElement('button'); b.textContent = v; b.onclick = () => setView(v); ui.appendChild(b); }
const go = +(q.get('go') || 0);
renderer.setAnimationLoop((now) => { const t = now / 1000; for (const b of boats) rockBoat(b, t, go); renderer.render(scene, camera); });
window.ready = true;
</script></body></html>
