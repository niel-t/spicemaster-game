# Publishes browser-game/ to GitLab Pages on every push to the game branch (and main once merged).
pages:
  image: alpine:latest
  stage: deploy
  script:
    - mkdir -p public
    - cp -r browser-game/index.html browser-game/js browser-game/vendor browser-game/assets public/
  artifacts:
    paths:
      - public
  publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == "claude/browser-game" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
